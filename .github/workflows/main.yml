name: Build SERVAN Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SERVAN
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --org com.servan .

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK and save log
        shell: bash
        run: |
          set +e
          flutter build apk --release -v > build.log 2>&1
          BUILD_EXIT_CODE=$?
          echo "BUILD_EXIT_CODE=$BUILD_EXIT_CODE" >> build.log
          exit $BUILD_EXIT_CODE

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SERVAN-BUILD-LOG
          path: build.log
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SERVAN-MOBILE-R06.0.0-APK
          path: build/app/outputs/flutter-apk/app-release.apk

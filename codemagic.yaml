workflows:
  servan_android_apk:
    name: SERVAN Android APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      java: 17
      vars:
        PACKAGE_NAME: "com.servan.servan_mobile"
    scripts:
      - name: Verify Flutter
        script: flutter --version
      - name: Generate Android platform
        script: flutter create --platforms=android --org com.servan .
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build release APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
